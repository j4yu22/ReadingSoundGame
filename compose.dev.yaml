# Optional localhost-only PostgreSQL for synthetic development data.
# docker compose -f compose.dev.yaml up -d
# Use DATABASE_URL from .env.example with the locally running API.
services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: reading_sound_game
      POSTGRES_USER: reading_sound_dev
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - development_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reading_sound_dev -d reading_sound_game"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length_on_error=0

volumes:
  development_postgres:
